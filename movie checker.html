<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Explorer</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      padding: 2rem;
    }

    .container { max-width: 1200px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 2rem; }
    h1 { color: var(--accent); margin-bottom: 1rem; }

    /* Controls Section */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
      justify-content: center;
    }

    input, select, button {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid #334155;
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
    }

    input:focus, select:focus { border-color: var(--accent); }
    button {
      background: var(--accent);
      color: #0f172a;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }
    button:hover { background: var(--accent-hover); color: white; }

    /* Movie Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }

    .card img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      background: #000;
    }

    .card-body {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      color: var(--text-sub);
      font-size: 0.9rem;
      margin-top: auto;
    }

    .rating { color: #f59e0b; font-weight: bold; }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      padding: 1rem;
      z-index: 1000;
    }
    .modal.active { display: flex; }

    .modal-content {
      background: var(--card-bg);
      max-width: 700px;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
    }

    @media (min-width: 600px) {
      .modal-content { flex-direction: row; }
      .modal-content img { width: 40%; object-fit: cover; }
      .modal-details { width: 60%; }
    }

    .modal-details { padding: 1.5rem; }
    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      background: none;
      border: none;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🎬 Movie Explorer</h1>
    </header>

    <div class="controls">
      <input type="text" id="search-input" placeholder="Search movies..." />
      <select id="genre-select">
        <option value="">All Genres</option>
      </select>
      <input type="number" id="year-input" placeholder="Year (e.g. 2023)" min="1900" max="2030" style="width: 120px;" />
      <button id="search-btn">Filter / Search</button>
    </div>

    <div id="movie-grid" class="grid"></div>
  </div>

  <!-- Detail Modal -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <button class="close-btn" id="close-modal">&times;</button>
      <img id="modal-img" src="" alt="Poster" />
      <div class="modal-details">
        <h2 id="modal-title"></h2>
        <p id="modal-tagline" style="font-style: italic; color: var(--text-sub); margin-bottom: 0.5rem;"></p>
        <p><strong class="rating">Rating:</strong> <span id="modal-rating"></span>/10</p>
        <p><strong>Release Date:</strong> <span id="modal-date"></span></p>
        <p style="margin-top: 1rem;" id="modal-overview"></p>
      </div>
    </div>
  </div>

  <script>
    // =========================================================
    // 👇 ADD YOUR TMDB API KEY HERE
    // =========================================================
    const API_KEY = 'c294f6632733f961a87e1bcfb1cd1c4b'; 
    // =========================================================

    // Configuration
    const BASE_URL = 'https://api.themoviedb.org/3';
    const IMAGE_BASE_URL = 'https://image.tmdb.org/t/p/w500';

    // UI Elements
    const searchInput = document.getElementById('search-input');
    const genreSelect = document.getElementById('genre-select');
    const yearInput = document.getElementById('year-input');
    const searchBtn = document.getElementById('search-btn');
    const grid = document.getElementById('movie-grid');

    const modal = document.getElementById('modal');
    const closeModal = document.getElementById('close-modal');

    // Fetch and populate genre dropdown on startup
    async function fetchGenres() {
      if (!API_KEY || API_KEY === 'YOUR_TMDB_API_KEY_HERE') return;
      try {
        const res = await fetch(`${BASE_URL}/genre/movie/list?api_key=${API_KEY}`);
        const data = await res.json();
        if (data.genres) {
          genreSelect.innerHTML = '<option value="">All Genres</option>';
          data.genres.forEach(g => {
            const opt = document.createElement('option');
            opt.value = g.id;
            opt.textContent = g.name;
            genreSelect.appendChild(opt);
          });
        }
      } catch (err) {
        console.error('Failed to load genres', err);
      }
    }

    // Load Movies (Supports search query or discovery filters)
    async function loadMovies() {
      if (!API_KEY || API_KEY === 'YOUR_TMDB_API_KEY_HERE') {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">Please add your API key in the JavaScript code.</p>';
        return;
      }

      const query = searchInput.value.trim();
      const genre = genreSelect.value;
      const year = yearInput.value.trim();

      let endpoint = '';
      
      // If keyword search is provided, hit search endpoint
      if (query) {
        endpoint = `${BASE_URL}/search/movie?api_key=${API_KEY}&query=${encodeURIComponent(query)}`;
        if (year) endpoint += `&primary_release_year=${year}`;
      } else {
        // Otherwise hit discovery endpoint to support full genre + year filtering
        endpoint = `${BASE_URL}/discover/movie?api_key=${API_KEY}&sort_by=popularity.desc`;
        if (genre) endpoint += `&with_genres=${genre}`;
        if (year) endpoint += `&primary_release_year=${year}`;
      }

      try {
        const res = await fetch(endpoint);
        const data = await res.json();
        
        if (!data.results || data.results.length === 0) {
          grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">No movies found.</p>';
          return;
        }

        displayMovies(data.results);
      } catch (err) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">Error fetching data. Check your API key.</p>';
      }
    }

    // Render cards
    function displayMovies(movies) {
      grid.innerHTML = movies.map(m => {
        const poster = m.poster_path ? IMAGE_BASE_URL + m.poster_path : 'https://via.placeholder.com/500x750?text=No+Poster';
        const year = m.release_date ? m.release_date.split('-')[0] : 'N/A';
        return `
          <div class="card" onclick="openMovieDetails(${m.id})">
            <img src="${poster}" alt="${m.title}">
            <div class="card-body">
              <div class="card-title">${m.title}</div>
              <div class="card-meta">
                <span>${year}</span>
                <span class="rating">★ ${m.vote_average.toFixed(1)}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Modal popup logic
    async function openMovieDetails(id) {
      const res = await fetch(`${BASE_URL}/movie/${id}?api_key=${API_KEY}`);
      const m = await res.json();

      document.getElementById('modal-img').src = m.poster_path ? IMAGE_BASE_URL + m.poster_path : 'https://via.placeholder.com/500x750?text=No+Poster';
      document.getElementById('modal-title').textContent = m.title;
      document.getElementById('modal-tagline').textContent = m.tagline || '';
      document.getElementById('modal-rating').textContent = m.vote_average.toFixed(1);
      document.getElementById('modal-date').textContent = m.release_date || 'N/A';
      document.getElementById('modal-overview').textContent = m.overview || 'No synopsis available.';

      modal.classList.add('active');
    }

    // Event listeners
    searchBtn.addEventListener('click', loadMovies);
    closeModal.addEventListener('click', () => modal.classList.remove('active'));
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });

    // Initial load
    fetchGenres();
    loadMovies();
  </script>
</body>
</html>
